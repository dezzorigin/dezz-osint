[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dezz-osint"
version = "0.2.0"
description = "Unified passive OSINT CLI + MCP server — tested engines only, no dummy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dezzorigin" }]
keywords = ["osint", "recon", "mcp", "cli"]
dependencies = [
    "pyfiglet==1.0.4",
    "rich==15.0.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "phonenumbers==9.0.43",
    "python-dotenv==1.2.4",
    "maigret==0.6.6",
    "pillow==13.0.0",
    "piexif==1.1.3",
    "selenium==4.53.0",
    "tld==0.13.2",
    "colorama==0.4.6",
    "yt-dlp==2026.10.26",
]

[project.scripts]
dezz = "dezz.cli:main"
dezzosint = "dezz.cli:main"

[project.urls]
Homepage = "https://github.com/dezzorigin/dezz-osint"

[tool.setuptools.packages.find]
include = ["dezz*"]

[tool.setuptools.package-data]
dezz = ["resources_catalog.json", "spiderfoot_modules.json", "engines/murl.json", "engines/validator/email-data.json"]

[tool.ruff]
# Lint ketat hanya untuk kode baru (tests/ + scripts/) — lihat CI.
# Tree lama dezz/ hanya dicek syntax (E9) supaya gaya lama tidak
# memblokir PR ini; perbaikan gaya legacy menyusul bertahap.
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests/test_cli.py"]
