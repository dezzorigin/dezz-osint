<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="150" viewBox="0 0 900 150" fill="none">
  <!-- Container Base -->
  <rect width="100%" height="100%" fill="#0a0a0a" rx="12"/>
  <rect x="1" y="1" width="898" height="148" rx="11" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Dialogue Line 1: Other Tools (Left Aligned) -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="440" height="50" rx="8" fill="#141414" stroke="#262626" stroke-width="1"/>
    <!-- Avatar / Author Badge -->
    <rect x="14" y="11" width="110" height="28" rx="4" fill="#262626"/>
    <text x="69" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#a1a1aa">OTHER TOOLS</text>
    <!-- Text Quote -->
    <text x="136" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#a1a1aa">"200 hits, semuanya valid."</text>
  </g>

  <!-- Dialogue Line 2: DEZZ (Right Aligned) -->
  <g transform="translate(436, 80)">
    <rect x="0" y="0" width="440" height="50" rx="8" fill="#171717" stroke="#3f3f46" stroke-width="1"/>
    <!-- Avatar / Author Badge (DEZZ in WHITE) -->
    <rect x="14" y="11" width="58" height="28" rx="4" fill="#ffffff"/>
    <text x="43" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="800" fill="#000000">DEZZ</text>
    <!-- Text Quote -->
    <text x="84" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" font-style="italic" fill="#ffffff">"Buktikan, atau tandai UNVERIFIED."</text>
  </g>
</svg>
