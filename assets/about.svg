<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="170" viewBox="0 0 900 170" fill="none">
  <!-- Container -->
  <rect width="100%" height="100%" fill="#0a0a0a" rx="12"/>
  <rect x="1" y="1" width="898" height="168" rx="11" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Badge Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="180" height="22" rx="4" fill="#171717" stroke="#3f3f46" stroke-width="1"/>
    <text x="90" y="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1.5">BUAT APA TOOL INI</text>
  </g>

  <!-- Content Paragraph -->
  <text x="30" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#e4e4e7">
    Cek nomor tak dikenal, lacak username di ratusan situs, periksa email yang bocor, dan petakan domain/IP.
  </text>
  <text x="30" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa">
    Semua pasif dan gratis tanpa API key.
  </text>

  <!-- Bottom Pills (NO EMOJIS) -->
  <g transform="translate(30, 118)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#171717" stroke="#27272a" stroke-width="1"/>
    <text x="65" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#a1a1aa">100% PASIF</text>

    <rect x="140" y="0" width="150" height="20" rx="4" fill="#171717" stroke="#27272a" stroke-width="1"/>
    <text x="215" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#a1a1aa">TANPA API KEY</text>

    <rect x="300" y="0" width="140" height="20" rx="4" fill="#171717" stroke="#27272a" stroke-width="1"/>
    <text x="370" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#a1a1aa">MCP READY</text>
  </g>
